    <script>
      // Aplica el tema antes de pintar para evitar el parpadeo.
      try {
        var t = localStorage.getItem('crm-theme')
        // El piso de exhibición es claro; el modo oscuro queda como opción.
        var dark = t === 'dark'
        var a = JSON.parse(localStorage.getItem('crm-ambito') || 'null')
        if (a && a.area) document.documentElement.dataset.area = a.area
        if (dark) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
